<!-- Unified Suggestion / Complaint Box (Shared Component) -->
<div class="form-card bg-surface-container-lowest p-8 rounded-xl border border-outline-variant shadow-sm">
<div class="flex items-center gap-4 mb-6">
<div class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center text-primary" id="feedback-icon-wrap">
<span class="material-symbols-outlined" id="feedback-icon" style="font-variation-settings: 'FILL' 1;">lightbulb</span>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-on-background">Share Your Feedback</h2>
<p class="text-on-surface-variant text-body-md" id="feedback-subtitle">Share your innovative ideas for community growth.</p>
</div>
</div>
<div class="flex gap-3 mb-6">
<button class="tag-btn flex-1 px-4 py-2 rounded-full border-2 font-label-md text-label-md font-bold transition-all" id="tag-suggestion" type="button">Feedback</button>
<button class="tag-btn flex-1 px-4 py-2 rounded-full border-2 font-label-md text-label-md font-bold transition-all" id="tag-complaint" type="button">Complaint</button>
</div>
<form class="space-y-6" id="feedback-form">
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="fb-name">Full Name</label>
<input class="w-full p-3 rounded-lg border border-outline focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all" id="fb-name" placeholder="John Doe" required="" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="fb-phone">Contact Number</label>
<input class="w-full p-3 rounded-lg border border-outline focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all" id="fb-phone" placeholder="+91 98765 43210" required="" type="tel"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="fb-email">Email Address</label>
<input class="w-full p-3 rounded-lg border border-outline focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all" id="fb-email" placeholder="john@example.com" required="" type="email"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="fb-address">Address</label>
<input class="w-full p-3 rounded-lg border border-outline focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all" id="fb-address" placeholder="House no., street, locality" type="text"/>
</div>
<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="fb-pincode">PIN Code</label>
<div class="relative">
<input class="w-full p-3 pr-10 rounded-lg border border-outline focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all" id="fb-pincode" inputmode="numeric" maxlength="6" placeholder="6-digit PIN code" type="text"/>
<span class="hidden absolute right-3 top-1/2 -translate-y-1/2 h-4 w-4 border-2 border-outline-variant border-t-primary rounded-full animate-spin" id="fb-pincode-loader"></span>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="fb-city">City</label>
<input class="w-full p-3 rounded-lg border border-outline focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all" id="fb-city" placeholder="City" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="fb-state">State</label>
<input class="w-full p-3 rounded-lg border border-outline focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all" id="fb-state" placeholder="State" type="text"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="fb-message" id="fb-message-label">Describe your feedback</label>
<textarea class="w-full p-3 rounded-lg border border-outline focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all" id="fb-message" placeholder="Tell us about your feedback..." required="" rows="5"></textarea>
</div>
<button class="w-full md:w-auto px-8 py-3 bg-primary-container text-on-primary-container font-bold rounded-lg hover:brightness-105 active:scale-95 transition-all flex items-center justify-center gap-2" id="fb-submit-btn" type="submit">
                        Submit Feedback <span class="material-symbols-outlined">send</span>
</button>
</form>
</div>
<script>
    (function () {
        let feedbackType = 'feedback';
        const tagBase = 'tag-btn flex-1 px-4 py-2 rounded-full border-2 font-label-md text-label-md font-bold transition-all';

        function switchFeedbackType(type) {
            feedbackType = type;
            if (type === 'feedback') {
                $('#tag-suggestion').attr('class', tagBase + ' bg-primary-container text-on-primary-container border-primary-container');
                $('#tag-complaint').attr('class', tagBase + ' border-outline-variant text-on-surface-variant hover:border-primary-container');
                $('#feedback-icon-wrap').attr('class', 'w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center text-primary');
                $('#feedback-icon').text('lightbulb');
                $('#feedback-subtitle').text('Share your innovative ideas for community growth.');
                $('#fb-message-label').text('Describe your feedback');
                $('#fb-message').attr('placeholder', 'Tell us about your feedback...');
                $('#fb-submit-btn').attr('class', 'w-full md:w-auto px-8 py-3 bg-primary-container text-on-primary-container font-bold rounded-lg hover:brightness-105 active:scale-95 transition-all flex items-center justify-center gap-2');
                $('#fb-submit-btn').html('Submit Feedback <span class="material-symbols-outlined">send</span>');
            } else {
                $('#tag-complaint').attr('class', tagBase + ' bg-secondary text-on-secondary border-secondary');
                $('#tag-suggestion').attr('class', tagBase + ' border-outline-variant text-on-surface-variant hover:border-primary-container');
                $('#feedback-icon-wrap').attr('class', 'w-12 h-12 rounded-full bg-tertiary-fixed flex items-center justify-center text-tertiary');
                $('#feedback-icon').text('report');
                $('#feedback-subtitle').text('Report issues or grievances for investigation.');
                $('#fb-message-label').text('Describe the issue or complaint');
                $('#fb-message').attr('placeholder', 'Describe the issue in detail...');
                $('#fb-submit-btn').attr('class', 'w-full md:w-auto px-8 py-3 bg-secondary text-on-secondary font-bold rounded-lg hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2');
                $('#fb-submit-btn').html('Submit Report <span class="material-symbols-outlined">priority_high</span>');
            }
        }

        $('#tag-suggestion').on('click', function () { switchFeedbackType('feedback'); });
        $('#tag-complaint').on('click', function () { switchFeedbackType('complaint'); });

        $('#fb-pincode').on('input', function () {
            const digits = $(this).val().replace(/\D/g, '').slice(0, 6);
            $(this).val(digits);
            if (digits.length === 6) {
                $('#fb-pincode-loader').removeClass('hidden');
                $.getJSON('https://api.postalpincode.in/pincode/' + digits).done(function (data) {
                    if (data && data[0] && data[0].Status === 'Success' && data[0].PostOffice && data[0].PostOffice.length) {
                        const po = data[0].PostOffice[0];
                        $('#fb-city').val(po.District);
                        $('#fb-state').val(po.State);
                    }
                }).always(function () {
                    $('#fb-pincode-loader').addClass('hidden');
                });
            }
        });

        $('#feedback-form').on('submit', function (e) {
            e.preventDefault();
            const btn = $('#fb-submit-btn');
            const originalHtml = btn.html();
            btn.prop('disabled', true).text('Submitting...');

            $.ajax({
                url: '/api/feedback/',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    type: feedbackType,
                    name: $('#fb-name').val(),
                    phone: $('#fb-phone').val(),
                    email: $('#fb-email').val(),
                    address: $('#fb-address').val(),
                    city: $('#fb-city').val(),
                    state: $('#fb-state').val(),
                    pincode: $('#fb-pincode').val(),
                    message: $('#fb-message').val()
                }),
                success: function () {
                    alert(feedbackType === 'feedback' ? 'Thank you for your feedback!' : 'Your report has been submitted for review.');
                    $('#feedback-form')[0].reset();
                    btn.prop('disabled', false).html(originalHtml);
                },
                error: function () {
                    alert('Something went wrong. Please try again.');
                    btn.prop('disabled', false).html(originalHtml);
                }
            });
        });

        switchFeedbackType('feedback');
    })();
</script>
