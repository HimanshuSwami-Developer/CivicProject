<!-- Donation Bottom Sheet (Shared Component) -->
<style>
    @keyframes donateSheetSlideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .donate-sheet-animate { animation: donateSheetSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
</style>
<div class="fixed inset-0 z-[100] hidden" id="donateSheet">
<div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeDonationSheet()"></div>
<div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl shadow-2xl donate-sheet-animate flex flex-col max-h-[92dvh]">
<!-- Sheet Header -->
<div class="bg-primary p-6 text-white rounded-t-3xl flex-shrink-0">
<div class="flex justify-between items-start">
<div>
<h4 class="font-bold text-xl">Make a Donation</h4>
<p class="text-sm text-white/70">Secure payment powered by Razorpay</p>
</div>
<button class="text-white/60 hover:text-white" onclick="closeDonationSheet()" type="button">
<span class="material-symbols-outlined">close</span>
</button>
</div>
</div>
<!-- Sheet Body -->
<div class="p-6 space-y-4 bg-surface-container-lowest overflow-y-auto" id="donateSheetFormWrap">
<form class="space-y-4" id="donateSheetForm">
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-1" for="sheetDonorName">Full Name</label>
<input class="w-full px-4 py-3 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" id="sheetDonorName" required="" type="text"/>
</div>
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-1" for="sheetDonorEmail">Email</label>
<input class="w-full px-4 py-3 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" id="sheetDonorEmail" required="" type="email"/>
</div>
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-1" for="sheetDonorPhone">Phone Number</label>
<input class="w-full px-4 py-3 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" id="sheetDonorPhone" required="" type="tel"/>
</div>
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-1" for="sheetDonorPincode">PIN Code</label>
<input class="w-full px-4 py-3 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" id="sheetDonorPincode" inputmode="numeric" maxlength="6" placeholder="6-digit PIN code" required="" type="text"/>
</div>
<div class="grid grid-cols-2 gap-4">
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-1" for="sheetDonorCity">City</label>
<input class="w-full px-4 py-3 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" id="sheetDonorCity" required="" type="text"/>
</div>
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-1" for="sheetDonorState">State</label>
<input class="w-full px-4 py-3 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" id="sheetDonorState" required="" type="text"/>
</div>
</div>
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-3">Amount</label>
<div class="grid grid-cols-3 gap-3 mb-3">
<button class="sheet-amount-btn border-2 border-outline-variant p-3 rounded-lg font-bold text-on-surface-variant hover:border-primary transition-all" data-amount="100" type="button">₹100</button>
<button class="sheet-amount-btn border-2 border-outline-variant p-3 rounded-lg font-bold text-on-surface-variant hover:border-primary transition-all" data-amount="500" type="button">₹500</button>
<button class="sheet-amount-btn border-2 border-outline-variant p-3 rounded-lg font-bold text-on-surface-variant hover:border-primary transition-all" data-amount="1000" type="button">₹1000</button>
</div>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant font-bold">₹</span>
<input class="w-full pl-8 pr-4 py-3 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" id="sheetCustomAmount" min="1" placeholder="Enter amount" required="" type="number"/>
</div>
</div>
<div class="hidden" id="sheetDonorPanWrap">
<label class="block text-label-md font-label-md text-on-surface-variant mb-1" for="sheetDonorPan">PAN Number</label>
<input class="w-full px-4 py-3 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all uppercase" id="sheetDonorPan" maxlength="10" placeholder="ABCDE1234F" type="text"/>
<p class="text-[11px] text-on-surface-variant mt-1">PAN is mandatory for donations above ₹25,000 as per Indian tax regulations.</p>
</div>
</form>
</div>
<!-- Success State -->
<div class="hidden flex-col items-center justify-center text-center p-10 bg-surface-container-lowest" id="donateSheetSuccess">
<div class="w-20 h-20 rounded-full bg-green-100 flex items-center justify-center mb-6 text-green-600">
<span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h4 class="font-bold text-xl text-primary mb-2">Thank You!</h4>
<p class="text-on-surface-variant text-sm mb-6">Your donation of <span class="font-bold text-primary" id="sheetSuccessAmount"></span> has been received. A receipt has been sent to your email.</p>
<button class="w-full bg-primary-container text-on-primary-container font-bold py-3 rounded-lg" onclick="closeDonationSheet()" type="button">Close</button>
</div>
<!-- Sheet Footer -->
<div class="p-6 pb-[max(1.5rem,env(safe-area-inset-bottom))] border-t border-outline-variant bg-white flex-shrink-0" id="donateSheetFooter">
<button class="w-full bg-secondary text-white font-bold py-4 rounded-lg flex items-center justify-center gap-2 hover:opacity-90 active:scale-95 transition-all shadow-lg" form="donateSheetForm" id="sheetPayBtn" type="submit">
                Pay <span id="sheetDisplayAmount">₹0</span> Securely
                <span class="material-symbols-outlined">lock</span>
</button>
<p class="text-center text-[10px] text-on-surface-variant mt-4 uppercase tracking-widest font-bold">
                Secured by Razorpay
            </p>
</div>
</div>
</div>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
    (function () {
        const PAN_REQUIRED_ABOVE = 25000;
        const PAN_RE = /^[A-Z]{5}[0-9]{4}[A-Z]$/;

        function updateSheetPanVisibility(amount) {
            const needsPan = amount > PAN_REQUIRED_ABOVE;
            $('#sheetDonorPanWrap').toggleClass('hidden', !needsPan);
            if (needsPan) {
                $('#sheetDonorPan').attr('required', 'required');
            } else {
                $('#sheetDonorPan').removeAttr('required').val('');
            }
        }

        window.openDonationSheet = function () {
            $('#donateSheetForm')[0].reset();
            $('.sheet-amount-btn').removeClass('border-primary bg-primary text-on-primary').addClass('border-outline-variant text-on-surface-variant');
            $('#sheetDisplayAmount').text('₹0');
            updateSheetPanVisibility(0);
            $('#donateSheetFormWrap').removeClass('hidden').addClass('block');
            $('#donateSheetFooter').removeClass('hidden').addClass('block');
            $('#donateSheetSuccess').addClass('hidden').removeClass('flex');
            $('#donateSheet').removeClass('hidden').addClass('block');
            $('body').css('overflow', 'hidden');
        };

        window.closeDonationSheet = function () {
            $('#donateSheet').addClass('hidden').removeClass('block');
            $('body').css('overflow', 'auto');
        };

        $(function () {
            $('#sheetDonorPincode').on('input', function () {
                const digits = $(this).val().replace(/\D/g, '').slice(0, 6);
                $(this).val(digits);
                if (digits.length === 6) {
                    $.getJSON('https://api.postalpincode.in/pincode/' + digits).done(function (data) {
                        if (data && data[0] && data[0].Status === 'Success' && data[0].PostOffice && data[0].PostOffice.length) {
                            const po = data[0].PostOffice[0];
                            $('#sheetDonorCity').val(po.District);
                            $('#sheetDonorState').val(po.State);
                        }
                    });
                }
            });

            $('#sheetDonorPan').on('input', function () {
                $(this).val($(this).val().toUpperCase());
            });

            $('.sheet-amount-btn').on('click', function () {
                const value = $(this).data('amount');
                $('.sheet-amount-btn').removeClass('border-primary bg-primary text-on-primary').addClass('border-outline-variant text-on-surface-variant');
                $(this).addClass('border-primary bg-primary text-on-primary').removeClass('border-outline-variant text-on-surface-variant');
                $('#sheetCustomAmount').val(value);
                $('#sheetDisplayAmount').text('₹' + value);
                updateSheetPanVisibility(value);
            });

            $('#sheetCustomAmount').on('input', function () {
                const val = Number($(this).val()) || 0;
                $('#sheetDisplayAmount').text('₹' + val);
                $('.sheet-amount-btn').removeClass('border-primary bg-primary text-on-primary').addClass('border-outline-variant text-on-surface-variant');
                updateSheetPanVisibility(val);
            });

            $('#donateSheetForm').on('submit', function (e) {
                e.preventDefault();
                const amount = parseFloat($('#sheetCustomAmount').val());
                if (!amount || amount <= 0) {
                    alert('Please enter a valid donation amount.');
                    return;
                }

                const pan = $('#sheetDonorPan').val().trim().toUpperCase();
                if (amount > PAN_REQUIRED_ABOVE) {
                    if (!pan) {
                        alert('PAN is required for donations above ₹25,000.');
                        return;
                    }
                    if (!PAN_RE.test(pan)) {
                        alert('Please enter a valid PAN number (format: ABCDE1234F).');
                        return;
                    }
                }

                const btn = $('#sheetPayBtn');
                const originalHtml = btn.html();
                btn.prop('disabled', true).html('Processing...');

                $.ajax({
                    url: '/api/donations/create-order/',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        donor_name: $('#sheetDonorName').val(),
                        email: $('#sheetDonorEmail').val(),
                        phone: $('#sheetDonorPhone').val(),
                        pincode: $('#sheetDonorPincode').val(),
                        city: $('#sheetDonorCity').val(),
                        state: $('#sheetDonorState').val(),
                        pan: pan,
                        amount: amount
                    }),
                    success: function (order) {
                        const rzp = new Razorpay({
                            key: order.key,
                            amount: order.amount,
                            currency: order.currency,
                            name: 'Sankalp Adhikar Vishwas Ekta Party',
                            description: 'Donation to Sankalp Adhikar Vishwas Ekta Party',
                            order_id: order.order_id,
                            prefill: {
                                name: order.name,
                                email: order.email,
                                contact: order.phone
                            },
                            theme: { color: '#002045' },
                            handler: function (response) {
                                $.ajax({
                                    url: '/api/donations/verify/',
                                    method: 'POST',
                                    contentType: 'application/json',
                                    data: JSON.stringify({
                                        donation_id: order.donation_id,
                                        razorpay_order_id: response.razorpay_order_id,
                                        razorpay_payment_id: response.razorpay_payment_id,
                                        razorpay_signature: response.razorpay_signature
                                    }),
                                    success: function (donation) {
                                        $('#sheetSuccessAmount').text('₹' + Number(donation.amount).toLocaleString('en-IN'));
                                        $('#donateSheetFormWrap').addClass('hidden').removeClass('block');
                                        $('#donateSheetFooter').addClass('hidden').removeClass('block');
                                        $('#donateSheetSuccess').removeClass('hidden').addClass('flex');
                                        btn.prop('disabled', false).html(originalHtml);
                                    },
                                    error: function () {
                                        alert('Your payment succeeded but we could not confirm it automatically. Please contact support with payment ID ' + response.razorpay_payment_id + '.');
                                        btn.prop('disabled', false).html(originalHtml);
                                    }
                                });
                            },
                            modal: {
                                ondismiss: function () {
                                    btn.prop('disabled', false).html(originalHtml);
                                }
                            }
                        });
                        rzp.on('payment.failed', function () {
                            btn.prop('disabled', false).html(originalHtml);
                            alert('Payment failed. Please try again.');
                        });
                        rzp.open();
                    },
                    error: function (xhr) {
                        btn.prop('disabled', false).html(originalHtml);
                        const msg = (xhr.responseJSON && xhr.responseJSON.error) || 'Something went wrong. Please try again.';
                        alert(msg);
                    }
                });
            });
        });
    })();
</script>
